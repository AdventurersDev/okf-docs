# okf-docs project config. Written by /okf-docs init; safe to edit. Commit it.
okf_docs: 1

# Core is always on. Add the modules this project uses: code, brain, publish.
modules: [code]

# One entry per bundle, with path relative to the project root.
# kind: docs, brain, site or other. preset: one from the plugin's presets folder.
# scope: the root subject for files that don't set their own.
bundles:
  - path: docs
    kind: docs
    preset: service
    scope: acme-api

# Bundles this one links to, such as the company brain: the URL that links use,
# and an optional local checkout so check can follow those links.
# related:
#   brain:
#     url: https://github.com/acme/brain/blob/main/brain
#     path: ../brain/brain

# relative (default), or rooted: /-prefixed links resolved from the bundle root.
links: relative

# Hooks (Claude Code only).
# session: at session start, tells the agent these docs exist and when to use them.
# edits: after an edit, reminds the agent once about docs that cite the edited
# file, and reports format problems in edited docs. Off by default.
# capture: when a session ends after real work, reminds the agent once to record
# corrections, conventions and decisions. Off by default.
hooks:
  session: true
  edits: false
  capture: false
  max_findings: 5

# Soft decay: a file's weight halves every half-life, looked up by type, then
# class, then default. never: no decay.
decay:
  default: 12mo
  observation: 3mo
  runbook: 6mo
  decision: never
  asset: never
  release: never
  update: never

# Brain module: raw asset files older than this, by the date their name starts
# with, are proposed for deletion. Their metadata files stay.
retention:
  raw_files: 24mo

# Brain module.
# actions: what ingest does with clear action items from meetings.
#   report (default): list them in the meeting's asset file and in chat; no tracking.
#   track: also keep them in <brain>/actions.md (Open and Done tables).
#   off: don't extract actions.
# names: how people are named in knowledge files.
#   team (default): name our own people; describe outside people by role and organization ("Initech IT lead").
#   roles: no personal names anywhere; use roles ("sales lead", "Initech IT lead").
#   all: name outside contacts too. Contact details (phone, email, address) are never written in any mode.
# tickets: also create tickets for meeting actions, through the connector you have for that system.
#   system: none (default), or the ticket system's name: linear, jira, github, asana, clickup, monday, ...
#   target: the team, project, board or repository the tickets go to.
#   Every ticket is previewed and created only after your OK; duplicates are linked, not created.
#   github: without a GitHub connector, the gh CLI is used instead, only in a git repository with a GitHub remote.
brain:
  actions: report
  names: team
  tickets:
    system: none
    target: ""

# Publish module. targets: help-center, developer, changelog, updates.
# tool: mkdocs, docusaurus, starlight, vitepress or none.
publish:
  targets: []
  tool: none
