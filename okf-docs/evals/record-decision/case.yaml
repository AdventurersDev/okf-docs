schema_version: "1.1"
name: record-decision
description: >-
  A decision that overturns an earlier one gets the next number and the stated reasons only,
  both records link each other, the old one is kept and deprecated, and the affected doc,
  the index and the log are updated.
tags: [write]
execution:
  prompt: >-
    Record this decision: CSV export is removed on 2026-12-01 and JSON becomes the only export
    format. This replaces decision 002. Why: CSV exports kept losing nested fields, and only 3%
    of exports last month were CSV. Alex made the call today.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?okf-docs"'
  - name: next-number
    type: regex
    target: files
    pattern: '(?:^|/)docs/decisions/003-[a-z0-9-]+\.md$'
    flags: m
  - name: decision-frontmatter
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path"\s*:\s*"[^"]*docs/decisions/003-[a-z0-9-]+\.md")(?=.*type: decision\\n)(?=.*generated:\\n\s+by: okf-docs/\d+\.\d+\.\d+\\n\s+at: \d{4}-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:Z|[+-]\d\d:\d\d))'
  - name: new-points-back
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path"\s*:\s*"[^"]*docs/decisions/003-)(?=.*supersedes: (?:\./)?002-json-export\.md)'
  - name: records-the-reasons
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path"\s*:\s*"[^"]*docs/decisions/003-)(?=.*nested)(?=.*3 ?%)'
  - name: no-invented-alternatives
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path"\s*:\s*"[^"]*docs/decisions/003-)(?=.*Not recorded)'
  - name: old-is-kept-and-deprecated
    type: regex
    target:
      source: file
      path: docs/decisions/002-json-export.md
    pattern: '^status: deprecated\s*$'
    flags: m
  - name: old-points-forward
    type: regex
    target:
      source: file
      path: docs/decisions/002-json-export.md
    pattern: '^superseded_by: (?:\./)?003-[a-z0-9-]+\.md\s*$'
    flags: m
  - name: affected-doc-updated
    type: regex
    target:
      source: file
      path: docs/product/data-export.md
    pattern: '003-[a-z0-9-]+\.md|2026-12-01|1 December|December 1'
  - name: index-lists-it
    type: regex
    target:
      source: file
      path: docs/decisions/index.md
    pattern: '\]\(003-[a-z0-9-]+\.md\)'
  - name: logged
    type: regex
    target:
      source: file
      path: docs/log.md
    pattern: '\*\*Decision\*\*'
    match: "count:2"
