schema_version: "1.1"
name: sync-limit-change
description: >-
  After a commit raises the export limit from 500 MB to 1 GB, sync updates the doc that states
  the limit, moves its generated date past the old human verification, deals with the help page that repeats it, logs
  the sync, and commits nothing. Works whether or not git runs in the sandbox.
tags: [sync, write]
execution:
  prompt: /okf-docs sync HEAD~1
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - name: context-ran
    type: tool_used
    tool: Bash
    input_match: 'okf\.py[\s\S]*\bcontext\b'
  - name: new-limit-in-doc
    type: regex
    target:
      source: file
      path: docs/product/data-export.md
    pattern: '\b(?:1\s?GB|1\s?GiB|1,?024\s?MB)\b'
  - name: old-limit-gone
    type: regex
    target:
      source: file
      path: docs/product/data-export.md
    pattern: '500\s?MB'
    match: not_contains
  - name: old-verification-outdated
    type: regex
    target:
      source: file
      path: docs/product/data-export.md
    pattern: 'generated:\s*\n\s+by: [^\n]+\n\s+at: "?(?:2026-(?:11-(?:0[3-9]|[12]\d|30)|12-\d\d)|20(?:2[7-9]|[3-9]\d))'
  - name: no-invented-review-write
    type: tool_used
    tool: Write
    input_match: '"content"\s*:\s*"(?:[^"\\]|\\.)*?(?:by: human:[^\\"]*\\n\s*(?:- )?at: "?(?!2026-11-02T09:00:00)\d|at: "?(?!2026-11-02T09:00:00)\d[^\\"]*\\n\s*by: human:)'
    min: 0
    max: 0
  - name: no-invented-review-edit
    type: tool_used
    tool: Edit
    # A new human event only: keeping alex's 2026-11-02 entry is right under OKF 0.3.
    input_match: '"new_string"\s*:\s*"(?:[^"\\]|\\.)*?(?:by: human:[^\\"]*\\n\s*(?:- )?at: "?(?!2026-11-02T09:00:00)\d|at: "?(?!2026-11-02T09:00:00)\d[^\\"]*\\n\s*by: human:)'
    min: 0
    max: 0
  - name: sync-logged
    type: regex
    target:
      source: file
      path: docs/log.md
    pattern: '\*\*Sync\*\*'
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-c\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: help-page-handled
    type: llm
    criteria: >-
      The help page help/export-your-data.md repeats the old 500 MB limit. PASS if the final reply
      says the help page was updated to the new limit, or names it as a page that still needs
      updating or sign-off. FAIL if the reply doesn't mention the help page at all.
