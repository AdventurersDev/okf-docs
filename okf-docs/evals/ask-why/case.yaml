schema_version: "1.1"
name: ask-why
description: >-
  A why question is answered from the decision records, the deprecated one included, with the
  files cited, and nothing is edited.
tags: [smoke, ask]
execution:
  prompt: Why is JSON our default export format? Was CSV ever the only option?
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?okf-docs"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: cites-both-decisions
    type: regex
    target: last_message
    pattern: '^(?=[\s\S]*002-json-export)(?=[\s\S]*001-csv-first)'
  - name: answer-from-the-records
    type: llm
    criteria: |
      The records say: decision 002, verified by human:alex on 2026-10-21, made JSON the default because most exports were imported into other tools and CSV lost nested fields; CSV stayed available. Decision 001, now deprecated and superseded by 002, made export CSV-only because CSV shipped in one sprint while JSON needed a schema review.
      PASS if the reply gives both reasons for JSON (imports into other tools, and lost nested fields), says export was once CSV-only and why, and points to the decision files it used.
      FAIL if it gives a reason the records don't contain as the main reason (for example speed or file size), says CSV was never the only option, or cites no files.
