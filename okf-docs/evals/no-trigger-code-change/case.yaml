schema_version: "1.1"
name: no-trigger-code-change
description: >-
  A code change in a project without OKF docs gets done without the skill, and no docs or
  config appear.
tags: [smoke, routing]
execution:
  prompt: Add a GET /invoices/:id route to src/server.ts that returns 404 when the invoice doesn't exist.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?okf-docs"'
    min: 0
    max: 0
    arm: both
  - name: route-added
    type: regex
    target:
      source: file
      path: src/server.ts
    pattern: '^(?=[\s\S]*\.get\(\s*["''`]/invoices/:id["''`])(?=[\s\S]*404)'
  - name: no-docs
    type: file_exists
    path: 'docs/**'
    exists: false
  - name: no-okf-config
    type: file_exists
    path: .okf/config.yaml
    exists: false
