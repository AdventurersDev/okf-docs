schema_version: "1.1"
name: debloat-readme
description: >-
  Debloating a README outside any bundle cuts hype, filler, emoji headings and the recap, keeps
  every fact, adds no frontmatter, and needs no init.
tags: [smoke, writing]
execution:
  prompt: Debloat README.md.
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?okf-docs"'
  - name: bloat-gone
    type: regex
    target:
      source: file
      path: README.md
    pattern: 'seamless|robust|powerful|cutting-edge|leverag|unlock|fast-paced|in today.s|feel free|super easy|a breeze|we hope|happy budgeting|incredibly|ultimate|basically|might potentially|important to note|🚀|✨|📦|🛠|⚙|⚠|🙌|🎉|📄|^#+ .*!\s*$|^#+ +(?:conclusion|summary)\s*$'
    flags: im
    match: not_contains
  - name: keeps-install
    type: regex
    target:
      source: file
      path: README.md
    pattern: '^(?=[\s\S]*npm install -g ledgerline)(?=[\s\S]*Node(?:\.js)?[^\n]{0,20}20)'
  - name: keeps-usage
    type: regex
    target:
      source: file
      path: README.md
    pattern: '^(?=[\s\S]*ledgerline import)(?=[\s\S]*--currency)(?=[\s\S]*EUR)'
  - name: keeps-limit
    type: regex
    target:
      source: file
      path: README.md
    pattern: '^(?=[\s\S]*50 ?MB)(?=[\s\S]*FILE_TOO_LARGE)'
  - name: keeps-config
    type: regex
    target:
      source: file
      path: README.md
    pattern: '^(?=[\s\S]*~/\.ledgerline\.toml)(?=[\s\S]*LEDGERLINE_TOKEN)(?=[\s\S]*MIT)'
  - name: no-frontmatter
    type: regex
    target:
      source: file
      path: README.md
    pattern: '^---\r?\n'
    match: not_contains
  - name: no-bundle
    type: file_exists
    path: .okf/config.yaml
    exists: false
  - name: reports-word-counts
    type: llm
    criteria: |
      PASS if the reply gives the README's word count before and after the edit, as two numbers or as one number and the change.
      FAIL if it gives no word counts.
