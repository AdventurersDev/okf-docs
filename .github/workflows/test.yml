name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PyYAML is only for the test that compares okf.py's YAML reader with a full parser.
      # The plugin itself uses the standard library only.
      - run: python -m pip install pyyaml
      - run: python -m unittest discover tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./okf-docs
      - run: claude plugin validate .

  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      # Pinned to the commit of the official validator that matches OKF 0.3, so upstream changes cannot break CI.
      - name: Fetch the official OKF validator
        run: |
          git clone https://github.com/open-knowledge-format/open-knowledge-format "$RUNNER_TEMP/okf"
          git -C "$RUNNER_TEMP/okf" checkout 527e81a
      - name: Validate the fixture bundles
        run: |
          for b in repo/docs repo/help brain-repo/brain; do
            python "$RUNNER_TEMP/okf/skills/okf-generate/scripts/validate.py" "okf-docs/evals/fixtures/$b" --strict --now 2026-11-13T12:00:00Z
          done
